<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px}
body{font-family:'Carlito','Liberation Sans',sans-serif;color:#1F2937;background:#fff;font-size:15px;line-height:1.25;display:flex;flex-direction:column;overflow:hidden}
.sb{height:44px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:700;font-size:15px}
.sb i{display:inline-block;width:18px;height:10px;border:1.5px solid #1F2937;border-radius:3px;margin-left:6px;position:relative}
.sb i:after{content:'';position:absolute;inset:1.5px;right:5px;background:#1F2937;border-radius:1px}
.bar{height:54px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1.5px solid #D1D5DB}
.bar h1{font-size:21px;font-weight:700;flex:1}
.bar small{display:block;font-size:13px;font-weight:400;color:#6B7280}
.pg{flex:1;padding:14px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;position:relative}
.nav{height:74px;flex:none;border-top:1.5px solid #D1D5DB;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;background:#fff}
.nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#6B7280;width:64px}
.nav .on{color:#0F766E;font-weight:700}
.nav .sell span{background:#0F766E;border-radius:50%;width:46px;height:46px;display:flex;align-items:center;justify-content:center;margin-top:-18px;border:4px solid #fff}
.nav .sell{color:#0F766E;font-weight:700}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{border:1.5px solid #D1D5DB;border-radius:12px;padding:12px}
.row{display:flex;align-items:center;gap:10px}
.col{display:flex;flex-direction:column}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grow{flex:1;min-width:0}
.mut{color:#6B7280} .sm{font-size:13px} .b{font-weight:700} .lg{font-size:22px;font-weight:700} .r{text-align:right}
.h2{font-size:16px;font-weight:700}
.chips{display:flex;gap:8px;flex:none;overflow:hidden}
.chip{border:1.5px solid #D1D5DB;border-radius:20px;padding:6px 13px;font-size:14px;white-space:nowrap;color:#1F2937}
.chip.on{background:#0F766E;border-color:#0F766E;color:#fff;font-weight:700}
.tag{font-size:12px;border-radius:6px;padding:2px 8px;background:#F3F4F6;color:#6B7280;font-weight:700;white-space:nowrap}
.tag.ok{background:#E3F3F0;color:#0F766E} .tag.warn{background:#FEF3C7;color:#B45309}
.btn{height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;border:1.5px solid #0F766E;color:#0F766E;flex:none}
.btn.p{background:#0F766E;color:#fff} .btn.d{border-color:#B91C1C;color:#B91C1C} .btn.s{height:40px;font-size:14px;border-radius:10px}
.in{height:44px;border:1.5px solid #D1D5DB;border-radius:10px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;color:#1F2937;flex:none}
.in.ph{color:#6B7280} .in.ta{height:76px;align-items:flex-start;padding-top:11px}
.lb{font-size:13px;color:#6B7280;margin-bottom:4px;font-weight:700}
.img{background:#F3F4F6;border:1.5px solid #D1D5DB;border-radius:10px;position:relative;display:flex;align-items:center;justify-content:center;color:#6B7280;font-size:12px;
background-image:linear-gradient(to top right,transparent calc(50% - 1px),#D1D5DB,transparent calc(50% + 1px)),linear-gradient(to top left,transparent calc(50% - 1px),#D1D5DB,transparent calc(50% + 1px))}
.av{width:42px;height:42px;border-radius:50%;background:#E3F3F0;color:#0F766E;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #E5E7EB}
.li:last-child{border-bottom:none}
.fab{position:absolute;right:16px;bottom:14px;height:50px;border-radius:25px;background:#0F766E;color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;padding:0 18px;font-size:15px}
.sw{width:44px;height:26px;border-radius:13px;background:#D1D5DB;position:relative;flex:none}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.sw.on{background:#0F766E} .sw.on:after{left:21px}
.pb{height:10px;border-radius:5px;background:#F3F4F6;border:1px solid #D1D5DB;overflow:hidden} .pb i{display:block;height:100%;background:#0F766E}
.step{display:flex;align-items:center;border:1.5px solid #D1D5DB;border-radius:10px;height:34px;flex:none}
.step b{width:32px;text-align:center;font-size:18px} .step span{width:30px;text-align:center;font-weight:700;border-left:1px solid #D1D5DB;border-right:1px solid #D1D5DB;line-height:32px}
.bars{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:6px}
.bars div{flex:1;background:#E3F3F0;border:1.5px solid #0F766E;border-radius:5px 5px 0 0;position:relative}
.bars div.hi{background:#0F766E}
.lab{display:flex;gap:8px;font-size:12px;color:#6B7280;margin-top:4px} .lab span{flex:1;text-align:center}
</style></head><body><div class="sb"><span>9:41</span><span>5G<i></i></span></div><div class="pg">
